<h2>Libros por biblioteca</h2>
<table>
  <thead>
    <tr>
      <th>Título</th>
      <th>Autor</th>
      <th>Año</th>
      <th>Biblioteca</th>
    </tr>
  </thead>
  <tbody>
    @for (libro of libros(); track libro.id) {
      <tr>
        <td>{{ libro.titulo }}</td>
        <td>{{ libro.autor }}</td>
        <td>{{ libro.anioPublicacion }}</td>
        <td>{{ libro.biblioteca }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4">No hay libros registrados.</td>
      </tr>
    }
  </tbody>
</table>
